spring.application.name=elcaro-bok-app-be

app.dev.test-login.enabled=false

spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=jdbc:postgresql://localhost:5432/elcaro
spring.datasource.username=postgres
spring.datasource.password=postgres

springdoc.packages-to-scan=pl.elcaro.elcarobokapp

spring.mail.host=email-smtp.us-east-1.amazonaws.com
spring.mail.port=587
spring.mail.username=${SES_SMTP_USERNAME}
spring.mail.password=${SES_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.email.enabled=true
app.email.from=elcaro@indicium.org.pl

jwt.secret=elcaro-bok-app-secret-key-change-in-prod
jwt.expiration-ms=86400000
